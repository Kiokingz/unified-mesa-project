name: build mesa

on:
 push:
    branches:
      - main

jobs:
 build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Homebrew and dependencies
      run: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        brew install pkg-config bison llvm meson
        pip3 install mako
        brew sh

    - name: Download and extract Mesa source code
      run: |
        mkdir ~/mesa
        cd ~/mesa
        curl -L https://mesa3d.org/archive/mesa-24.0.2.tar.xz | tar xJf -

    - name: Configure and build Mesa
      run: |
        cd ~/mesa/mesa-24.0.2
        mkdir build
        meson build -Dgallium-drivers=swrast -Ddri-drivers= -Dvulkan-drivers= -Dprefix=~/mesa/build/install -Dlibunwind=disabled -Dosmesa=true -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dglx=disabled -Dvalgrind=disabled -Dc_std=c11 -Dshared-llvm=false -Dshared-glapi=enabled
        ninja -C build

    - name: Copy dylib
      run: |
        cp build/src/gallium/targets/osmesa/libOSMesa.8.dylib ~/mesa/build/install/lib
        cp build/src/mapi/shared-glapi/libglapi.0.dylib ~/mesa/build/install/lib
        install_name_tool -change "@rpath/libglapi.0.dylib" "@executable_path/libglapi.0.dylib" ~/mesa/build/install/lib/libOSMesa.8.dylib

    - name: Upload dylib
      uses: actions/upload-artifact@v2
      with:
        name: Mesa-24.0.2-dylib
        path: ~/mesa/build/install/lib/libOSMesa.8.dylib
